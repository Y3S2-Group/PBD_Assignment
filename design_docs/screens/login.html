    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(32, 31, 31, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(238, 220, 255, 0.15);
            border-color: #eedcff;
        }
        .massive-btn {
            height: 56px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .massive-btn:active {
            transform: scale(0.96);
        }
        body {
            background-color: #131313;
            color: #e5e2e1;
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen overflow-hidden px-container-margin">
<!-- Atmospheric Background Decoration -->
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-primary/10 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[400px] h-[400px] rounded-full bg-secondary/5 blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-md relative z-10">
    <!-- Logo Area -->
    <div class="flex flex-col items-center mb-xl">
        <div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center mb-md shadow-[0_0_40px_rgba(238,220,255,0.3)]">
            <span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
        </div>
        <h1 class="font-headline-md text-headline-md font-bold text-on-surface">Vault</h1>
        <p class="font-body-md text-on-surface-variant mt-xs">Personal Wealth Management</p>
    </div>
    <!-- Login Container -->
    <div class="glass-card rounded-[32px] p-xl shadow-2xl">
        <header class="mb-xl text-center md:text-left">
            <h2 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h2>
            <p class="font-body-md text-on-surface-variant">Access your high-performance portfolio</p>
        </header>
        <form class="space-y-lg" onsubmit="event.preventDefault();">
            <!-- Email Field -->
            <div class="space-y-xs">
                <label class="font-label-md text-label-md text-on-surface-variant block ml-1">Work Email</label>
                <div class="relative flex items-center input-glow transition-all duration-300 bg-surface-container-high rounded-xl border border-border-glass">
                    <span class="material-symbols-outlined absolute left-md text-outline" data-icon="alternate_email">alternate_email</span>
                    <input class="w-full bg-transparent border-none focus:ring-0 pl-12 pr-md py-md font-body-md text-on-surface placeholder:text-outline-muted" placeholder="name@company.com" type="email"/>
                </div>
            </div>
            <!-- Password Field -->
            <div class="space-y-xs">
                <div class="flex justify-between items-center ml-1">
                    <label class="font-label-md text-label-md text-on-surface-variant">Master Password</label>
                    <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
                </div>
                <div class="relative flex items-center input-glow transition-all duration-300 bg-surface-container-high rounded-xl border border-border-glass">
                    <span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock">lock</span>
                    <input class="w-full bg-transparent border-none focus:ring-0 pl-12 pr-12 py-md font-body-md text-on-surface placeholder:text-outline-muted" placeholder="••••••••" type="password"/>
                    <button class="absolute right-md text-outline hover:text-on-surface transition-colors" type="button">
                        <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                    </button>
                </div>
            </div>
            <!-- Main Action -->
            <button class="massive-btn w-full bg-primary text-on-primary font-title-lg text-title-lg font-bold flex items-center justify-center gap-base shadow-xl">
                Login
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
            </button>
            <!-- Biometric Alternative -->
            <div class="flex flex-col items-center py-base">
                <button class="group flex flex-col items-center gap-xs focus:outline-none" type="button">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center border border-border-glass group-hover:border-primary/50 group-hover:bg-primary/5 transition-all duration-300">
                        <span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary text-[28px]" data-icon="fingerprint">fingerprint</span>
                    </div>
                    <span class="font-label-sm text-label-sm text-outline-muted uppercase tracking-wider group-hover:text-on-surface">Biometric Login</span>
                </button>
            </div>
        </form>
    </div>
    <!-- Social Login Section -->
    <footer class="mt-xl">
        <div class="flex items-center gap-md mb-lg">
            <div class="h-[1px] flex-1 bg-border-glass"></div>
            <span class="font-label-sm text-label-sm text-outline-muted">OR CONTINUE WITH</span>
            <div class="h-[1px] flex-1 bg-border-glass"></div>
        </div>
        <div class="grid grid-cols-2 gap-md">
            <button class="flex items-center justify-center gap-base h-14 bg-surface-container-low border border-border-glass rounded-xl hover:bg-surface-container-high transition-colors group">
                <img alt="Google" class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDj5bUoe58Kk8ci3_n3FR4kGXrHmlEWzNIxPCOIPyzTstsdQZfn9D5SV-I261mFJC2fvlRQ6WmKefUqHN0HIxY7KGFJOQ-y0U7oJhiARjinPIU8A9MdpPr46alrGFE89zlT2e5HLJ2UmYm7Gd2LCIN-iN9ku4WGeTYc-24zNKUWyPdKOioPycrUVu_7-0VaTR_McNltqalRjGkWFAItxrn5deUqxLc7RZaT_pllfphnl4MqpjBahFD0bJ9ruV6Gsn7JCtT--R3LE70"/>
                <span class="font-label-md text-label-md text-on-surface">Google</span>
            </button>
            <button class="flex items-center justify-center gap-base h-14 bg-surface-container-low border border-border-glass rounded-xl hover:bg-surface-container-high transition-colors group">
                <span class="material-symbols-outlined text-on-surface text-[20px]" data-icon="terminal" style="font-variation-settings: 'FILL' 1;">terminal</span>
                <span class="font-label-md text-label-md text-on-surface">GitHub</span>
            </button>
        </div>
        <p class="text-center mt-xl font-body-md text-on-surface-variant">
            Don't have an account?
            <a class="text-secondary font-bold hover:underline" href="#">Apply for Access</a>
        </p>
    </footer>
</main>
<!-- Micro-interaction Script -->
<script>
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('scale-[1.01]');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('scale-[1.01]');
        });
    });
</script>
</body></html>
