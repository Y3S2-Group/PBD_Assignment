<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col overflow-x-hidden bg-mesh">
<!-- Top App Bar (Transactional Suppression Logic Applied) -->
<header class="w-full top-0 sticky flex justify-between items-center px-gutter py-md bg-background z-50">
    <div class="flex items-center gap-xs">
        <span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
        <span class="font-headline-md text-headline-md font-bold text-primary">Vault</span>
    </div>
    <button class="p-2 rounded-full hover:bg-surface-container-high transition-colors" onclick="history.back()">
        <span class="material-symbols-outlined text-on-surface">close</span>
    </button>
</header>
<main class="flex-grow flex flex-col px-gutter pt-lg pb-xl">
    <!-- Hero Header -->
    <div class="mb-xl">
        <h1 class="font-headline-lg text-headline-lg mb-xs">Create Account</h1>
        <p class="font-body-md text-on-surface-variant">Join the elite platform for high-performance wealth management.</p>
    </div>
    <!-- Signup Form -->
    <section class="space-y-lg">
        <div class="space-y-md">
            <!-- Full Name Field -->
            <div class="group">
                <label class="font-label-md text-label-md text-outline mb-xs block px-1">Full Name</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">person</span>
                    <input class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 pl-12 pr-md text-on-surface font-body-md focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant/50" placeholder="Enter your full name" type="text"/>
                </div>
            </div>
            <!-- Email Field -->
            <div class="group">
                <label class="font-label-md text-label-md text-outline mb-xs block px-1">Email Address</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">mail</span>
                    <input class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 pl-12 pr-md text-on-surface font-body-md focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant/50" placeholder="name@company.com" type="email"/>
                </div>
            </div>
            <!-- Password Field -->
            <div class="group">
                <label class="font-label-md text-label-md text-outline mb-xs block px-1">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>
                    <input class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 pl-12 pr-md text-on-surface font-body-md focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant/50" placeholder="••••••••" type="password"/>
                    <button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface">
                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>
            <!-- Retype Password Field -->
            <div class="group">
                <label class="font-label-md text-label-md text-outline mb-xs block px-1">Retype Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">verified_user</span>
                    <input class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 pl-12 pr-md text-on-surface font-body-md focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant/50" placeholder="••••••••" type="password"/>
                </div>
            </div>
        </div>
        <!-- Terms and Conditions -->
        <div class="flex items-start gap-sm px-1">
            <input class="mt-1 w-5 h-5 rounded border-outline-variant bg-surface-container text-primary focus:ring-primary focus:ring-offset-background" id="terms" type="checkbox"/>
            <label class="font-body-md text-on-surface-variant leading-tight" for="terms">
                By creating an account, I agree to the <span class="text-primary hover:underline cursor-pointer">Terms of Service</span> and <span class="text-primary hover:underline cursor-pointer">Privacy Policy</span>.
            </label>
        </div>
        <!-- Primary Action -->
        <button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl flex items-center justify-center gap-base active:scale-95 transition-transform neon-glow">
            Create Account
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>
    </section>
    <!-- Social Signup Divider -->
    <div class="my-xl flex items-center gap-md">

        <span class="font-label-md text-label-md text-outline">OR CONTINUE WITH</span>
        <div class="h-[1px] flex-grow bg-outline-variant/30"></div>
    </div>
    <!-- Social Options -->

            <span class="font-label-md text-label-md">Google</span>
        </button>
        <button class="flex items-center justify-center gap-base py-3 border border-outline-variant rounded-xl bg-surface-container hover:bg-surface-container-high transition-colors">
            <img alt="Apple" class="w-5 h-5 invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-rseDLbR3V7vLmWq3rxEj07-IZn2uJsVhhozLt_MchQom9qHfi3puUP24kx_-JmxzyzmKljH8l3W75QtINoxSYJgUyOJd9wNvEJp6Dj1lN8xW_B9bdq5V6o-v_SzC5d27tm6uBnvt6JTKuvf8pzWdvn8bAoVjkanAK1GMdW3McJQ8kmJQ5EkPRPNe7_mUU0QfNpWxky9ksB5vkIitavcR6B4gebF1sEhNgPxKIh04m7-_RaozFVzHZpWCFoUQzBw5cNzsoFsFm6A"/>
            <span class="font-label-md text-label-md">Apple</span>
        </button>
    </div>
    <!-- Footer Footer -->
    <div class="mt-auto pt-xl text-center">
        <p class="font-body-md text-on-surface-variant">
            Already have an account?
            <a class="text-secondary font-bold hover:underline ml-xs" href="#">Sign In</a>
        </p>
    </div>
</main>
<!-- Background Decorative Element -->
<div class="fixed top-[-10%] right-[-10%] w-[400px] h-[400px] bg-primary/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-[5%] left-[-20%] w-[300px] h-[300px] bg-secondary/5 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
<script>
    // Simple micro-interaction for password toggle
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if(e.currentTarget.querySelector('.material-symbols-outlined')?.textContent === 'visibility') {
                const input = e.currentTarget.previousElementSibling;
                const icon = e.currentTarget.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            }
        });
    });

    // Add visual feedback to inputs
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('neon-glow');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('neon-glow');
        });
    });
</script>
</body></html>
