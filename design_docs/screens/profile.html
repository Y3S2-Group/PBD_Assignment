<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-primary": "#6e528f",
                      "tertiary-container": "#ffb4a9",
                      "primary-fixed": "#eedbff",
                      "inverse-surface": "#e5e2e1",
                      "error-container": "rgba(147, 0, 10, 0.3)",
                      "primary": "#eedcff",
                      "surface-container-high": "#2a2a2a",
                      "border-glass": "rgba(255, 255, 255, 0.05)",
                      "inverse-on-surface": "#313030",
                      "on-primary-container": "#614683",
                      "surface": "#131313",
                      "surface-dim": "#131313",
                      "secondary-container": "#04bb63",
                      "on-tertiary-fixed": "#360e09",
                      "on-error": "#690005",
                      "outline-variant": "#4a454f",
                      "surface-container-low": "#1c1b1b",
                      "on-primary": "#3e235e",
                      "error": "#ffb4ab",
                      "on-tertiary-container": "#7a433b",
                      "on-background": "#e5e2e1",
                      "surface-tint": "#dab9ff",
                      "on-primary-fixed-variant": "#553a76",
                      "primary-fixed-dim": "#dab9ff",
                      "on-error-container": "#ffdad6",
                      "on-surface-variant": "#ccc4d0",
                      "tertiary-fixed": "#ffdad5",
                      "on-tertiary-fixed-variant": "#6c3831",
                      "secondary-fixed-dim": "#49e183",
                      "success-container": "rgba(6, 187, 99, 0.3)",
                      "on-secondary-fixed": "#00210c",
                      "on-surface": "#e5e2e1",
                      "tertiary-fixed-dim": "#ffb4a9",
                      "on-tertiary": "#51221c",
                      "secondary-fixed": "#6afe9c",
                      "on-primary-fixed": "#280a47",
                      "on-secondary": "#003919",
                      "primary-container": "#dab9ff",
                      "outline": "#968e9a",
                      "surface-container-lowest": "#0e0e0e",
                      "surface-glass": "rgba(30, 30, 30, 0.6)",
                      "surface-container-highest": "#353534",
                      "surface-container": "#201f1f",
                      "surface-variant": "#353534",
                      "secondary": "#49e183",
                      "outline-muted": "#978d9d",
                      "on-secondary-fixed-variant": "#005228",
                      "tertiary": "#ffdad5",
                      "background": "#131313",
                      "surface-bright": "#393939",
                      "on-secondary-container": "#00431f"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "32px",
                      "lg": "24px",
                      "container-margin": "20px",
                      "base": "8px",
                      "xs": "4px",
                      "md": "16px",
                      "sm": "12px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "label-sm": ["JetBrains Mono"],
                      "body-md": ["Inter"],
                      "display-lg": ["Hanken Grotesk"],
                      "headline-md": ["Hanken Grotesk"],
                      "label-md": ["JetBrains Mono"],
                      "title-lg": ["Inter"],
                      "headline-lg": ["Hanken Grotesk"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "label-sm": ["10px", {"lineHeight": "12px", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
    <style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(32, 31, 31, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(238, 220, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .switch-input:checked + .switch-slider {
            background-color: #04bb63;
        }
        .switch-input:checked + .switch-slider:before {
            transform: translateX(18px);
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body-md text-body-md pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface-glass border-b border-border-glass h-16">
    <div class="flex justify-between items-center px-container-margin h-full w-full max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-border-glass">
                <img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional studio portrait of a modern tech executive with a clean, minimalist aesthetic. The lighting is soft and high-key, highlighting subtle facial features against a deep obsidian background. The overall mood is sophisticated and reliable, reflecting a high-performance personal wealth management identity with a touch of glassmorphic corporate elegance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEompQv2g3JFriqPcscoMpY2ItpyLuinwFZQr9uhJhzisx9XXuheb3RGZr8UVfsdJUQNvZ0B_mn4TaKGvLClUnrabGiyZC_9DQ_nuH0o0p1HnWcV_XuXJx3O-EncCztZwTaE1stA6SZ1EF2lLHn2MfFykJbm3qdK3MaM9GFjm38UjARsEiepgwO_INaLfTt_TsNy5D8InvonTzU0fUe8P-9gFmRTdBvKnymNq_UDEnSueVHaY_ZnaeWzEIB2MYo3b496zpdWCQnHQ"/>
            </div>
            <span class="font-headline-md text-headline-md font-bold text-on-surface">Vault</span>
        </div>
        <button class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-150">
            notifications
        </button>
    </div>
</header>
<main class="mt-20 px-container-margin max-w-2xl mx-auto space-y-lg">
    <!-- Hero Profile Section -->
    <section class="relative overflow-hidden glass-card rounded-xl p-lg mt-8">
        <div class="glow-accent"></div>
        <div class="flex flex-col items-center text-center space-y-md">
            <div class="relative">
                <div class="w-24 h-24 rounded-full border-2 border-secondary p-1">
                    <img class="w-full h-full rounded-full object-cover bg-surface-container" data-alt="A high-resolution, close-up digital portrait of a sophisticated male professional. The subject has a confident expression, set against a dark, tech-inspired backdrop with subtle neon green accents. The lighting is dramatic and directional, creating a sense of depth and precision typical of a high-end financial application's profile interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWE25lNOH1qco7Jqd58n2JMq4_sT3XIa6NYMJ0F51O0KM_ujUCccZ2VdDyeY889VgvJFwf6GY2Hs7JsGTFWW_OnfIohQ5zrr3vQGTpJLee8GQhnF-sj-4esQMjqy2qL9EjQ9HffT91oQmNq1usHvv1MtBq_WItBYBckaxMKZ3JFJEPCtvC8Y5CmAIxhyHpKtLgQLWNygQ-VjCRcF89iQN4ANGuKGP2QP1TmRQwETzIaMaW3HFXIQYOhusWFzeBExrsMUxT-MRPYgI"/>
                </div>
                <button class="absolute bottom-0 right-0 bg-secondary text-on-secondary rounded-full p-1.5 shadow-xl border-2 border-surface">
                    <span class="material-symbols-outlined text-[18px]">edit</span>
                </button>
            </div>
            <div>
                <h1 class="font-headline-lg text-headline-lg text-on-surface">Alex Thompson</h1>
                <p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Member since Oct 2024</p>
            </div>
        </div>
    </section>
    <!-- General Section -->
    <section class="space-y-base">
        <h2 class="font-label-md text-label-md text-outline px-xs uppercase">General</h2>
        <div class="bg-surface-container rounded-xl overflow-hidden">
            <!-- Dark Mode Toggle -->
            <div class="flex items-center justify-between p-md hover:bg-surface-container-high transition-colors border-b border-border-glass">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">dark_mode</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Dark Mode</span>
                </div>
                <label class="relative inline-block w-11 h-6 transition duration-200 ease-in-out cursor-pointer">
                    <input checked="" class="switch-input sr-only" type="checkbox"/>
                    <span class="switch-slider absolute top-0 left-0 right-0 bottom-0 bg-outline-variant rounded-full transition-all duration-300 before:content-[''] before:absolute before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all before:duration-300"></span>
                </label>
            </div>
            <!-- Language -->
            <button class="w-full flex items-center justify-between p-md hover:bg-surface-container-high transition-colors border-b border-border-glass text-left">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">language</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Language</span>
                </div>
                <div class="flex items-center gap-base">
                    <span class="font-body-md text-body-md text-on-surface-variant">English</span>
                    <span class="material-symbols-outlined text-outline">chevron_right</span>
                </div>
            </button>
            <!-- Currency -->
            <button class="w-full flex items-center justify-between p-md hover:bg-surface-container-high transition-colors text-left">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">payments</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Currency</span>
                </div>
                <div class="flex items-center gap-base">
                    <span class="font-body-md text-body-md text-on-surface-variant">USD / LKR</span>
                    <span class="material-symbols-outlined text-outline">chevron_right</span>
                </div>
            </button>
        </div>
    </section>
    <!-- Security Section -->
    <section class="space-y-base">
        <h2 class="font-label-md text-label-md text-outline px-xs uppercase">Security</h2>
        <div class="bg-surface-container rounded-xl overflow-hidden">
            <button class="w-full flex items-center justify-between p-md hover:bg-surface-container-high transition-colors border-b border-border-glass text-left">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-secondary">
                        <span class="material-symbols-outlined">lock</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Change Password</span>
                </div>
                <span class="material-symbols-outlined text-outline">chevron_right</span>
            </button>
            <div class="flex items-center justify-between p-md hover:bg-surface-container-high transition-colors text-left">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-secondary">
                        <span class="material-symbols-outlined">fingerprint</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Biometrics</span>
                </div>
                <label class="relative inline-block w-11 h-6 transition duration-200 ease-in-out cursor-pointer">
                    <input checked="" class="switch-input sr-only" type="checkbox"/>
                    <span class="switch-slider absolute top-0 left-0 right-0 bottom-0 bg-outline-variant rounded-full transition-all duration-300 before:content-[''] before:absolute before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all before:duration-300"></span>
                </label>
            </div>
        </div>
    </section>
    <!-- Legal Section -->
    <section class="space-y-base">
        <h2 class="font-label-md text-label-md text-outline px-xs uppercase">Legal</h2>
        <div class="bg-surface-container rounded-xl overflow-hidden">
            <button class="w-full flex items-center justify-between p-md hover:bg-surface-container-high transition-colors border-b border-border-glass text-left">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined">policy</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Privacy Policy</span>
                </div>
                <span class="material-symbols-outlined text-outline">chevron_right</span>
            </button>
            <button class="w-full flex items-center justify-between p-md hover:bg-surface-container-high transition-colors text-left">
                <div class="flex items-center gap-md">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined">description</span>
                    </div>
                    <span class="font-title-lg text-title-lg">Terms of Service</span>
                </div>
                <span class="material-symbols-outlined text-outline">chevron_right</span>
            </button>
        </div>
    </section>
    <!-- Logout Button -->
    <button class="w-full py-md text-error font-title-lg text-title-lg text-center bg-error-container rounded-xl border border-error/10 active:scale-[0.98] transition-all">
        Log Out
    </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-20 backdrop-blur-2xl bg-surface-glass border-t border-border-glass shadow-xl">
    <div class="flex justify-around items-center h-full w-full px-base max-w-7xl mx-auto">
        <button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all active:scale-90 duration-200">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-sm text-label-sm">Dashboard</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all active:scale-90 duration-200">
            <span class="material-symbols-outlined">payments</span>
            <span class="font-label-sm text-label-sm">Income</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all active:scale-90 duration-200">
            <span class="material-symbols-outlined">account_balance_wallet</span>
            <span class="font-label-sm text-label-sm">Budget</span>
        </button>
        <!-- Expenses is conceptually the closest to where profile/settings usually lives in this layout or represents the active state of navigation -->
        <button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 active:scale-90 duration-200">
            <span class="material-symbols-outlined">person</span>
            <span class="font-label-sm text-label-sm">Profile</span>
        </button>
    </div>
</nav>
<script>
    // Simple micro-interaction for the switches
    document.querySelectorAll('.switch-input').forEach(sw => {
        sw.addEventListener('change', function() {
            const parent = this.closest('label');
            parent.style.transform = 'scale(1.1)';
            setTimeout(() => {
                parent.style.transform = 'scale(1)';
            }, 150);
        });
    });

    // Add subtle hover effect on list items
    document.querySelectorAll('.hover\\:bg-surface-container-high').forEach(item => {
        item.addEventListener('mouseenter', () => {
            item.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        });
    });
</script>
</body></html>
